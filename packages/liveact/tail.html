<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LiveTrack</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        background-color: rgba(0, 0, 0, 0) !important;
        -webkit-user-select: none;
        user-select: none;
      }
      .tail-shell {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
      }
      .tail-ripple {
        position: absolute;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid rgba(252, 204, 68, 0.85);
        box-sizing: border-box;
        opacity: 0;
        pointer-events: none;
        z-index: 0;
        background: transparent;
      }
      .tail-shell.speaking .tail-ripple {
        animation: tail-ripple 2s cubic-bezier(0.15, 0.65, 0.35, 1) infinite;
        animation-delay: calc(var(--i, 0) * -0.5s);
      }
      button#open {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        margin: 0;
        padding: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 42% 36%, #e83a48 0%, #d41c2c 58%, #b01624 100%);
        color: #fff;
        cursor: pointer;
        box-shadow: none;
        border: 4px solid #fccc44;
        font-family: "Segoe UI", "Avenir Next", sans-serif;
        -webkit-app-region: no-drag;
        outline: none;
        appearance: none;
        -webkit-appearance: none;
        overflow: hidden;
      }
      button#open.ok {
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.55);
      }
      button#open.bad {
        box-shadow: 0 0 0 3px rgba(212, 28, 44, 0.55);
        animation: pulse 1s ease infinite;
      }
      .tail-idle {
        display: grid;
        place-items: center;
        line-height: 1;
      }
      .tail-shell.speaking .tail-idle {
        display: none;
      }
      .tail-speak-icon {
        display: none;
        width: 28px;
        height: 28px;
      }
      .tail-shell.speaking .tail-speak-icon {
        display: block;
      }
      .mark {
        display: block;
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1;
      }
      .name {
        display: block;
        margin-top: 2px;
        font-size: 0.52rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes tail-ripple {
        0% {
          transform: scale(1);
          opacity: 0.9;
          border-width: 3px;
        }
        70% {
          opacity: 0.28;
          border-width: 1.5px;
        }
        100% {
          transform: scale(2.05);
          opacity: 0;
          border-width: 1px;
        }
      }
    </style>
  </head>
  <body>
    <div class="tail-shell" id="tailShell">
      <span class="tail-ripple" style="--i: 0"></span>
      <span class="tail-ripple" style="--i: 1"></span>
      <span class="tail-ripple" style="--i: 2"></span>
      <span class="tail-ripple" style="--i: 3"></span>
      <button id="open" type="button" title="Open LiveTrack">
        <span class="tail-idle">
          <span class="mark">L</span>
          <span class="name">LiveTrack</span>
        </span>
        <svg class="tail-speak-icon" viewBox="0 0 48 48" width="28" height="28" aria-hidden="true" focusable="false">
          <circle cx="19.5" cy="15" r="7" fill="#fff" />
          <path
            d="M8 36.5c2.2-7.2 6.6-11 11.5-11s9.3 3.8 11.5 11"
            fill="#fff"
          />
          <path
            d="M29 12.2c1.6 1.3 2.6 3.1 2.6 5.2s-1 3.9-2.6 5.2"
            fill="none"
            stroke="#fff"
            stroke-width="2.3"
            stroke-linecap="round"
          />
          <path
            d="M32.4 9.6c2.4 1.9 3.8 4.6 3.8 7.8s-1.4 5.9-3.8 7.8"
            fill="none"
            stroke="#fff"
            stroke-width="2.3"
            stroke-linecap="round"
            opacity="0.9"
          />
          <path
            d="M35.8 7c3.1 2.5 5 6 5 10.4s-1.9 7.9-5 10.4"
            fill="none"
            stroke="#fff"
            stroke-width="2.3"
            stroke-linecap="round"
            opacity="0.7"
          />
        </svg>
      </button>
    </div>
    <script>
      const openBtn = document.getElementById("open");
      const shell = document.getElementById("tailShell");

      function openMain() {
        if (window.coactTail?.openMain) {
          window.coactTail.openMain();
        }
      }

      openBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        openMain();
      });

      if (window.coactTail?.onStatus) {
        window.coactTail.onStatus((status) => {
          openBtn.classList.toggle("ok", Boolean(status?.ok) && !status?.speaking);
          openBtn.classList.toggle("bad", Boolean(status?.bad) && !status?.speaking);
          shell.classList.toggle("speaking", Boolean(status?.speaking));
        });
      }
    </script>
  </body>
</html>
