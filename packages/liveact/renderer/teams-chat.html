<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LiveTrack AI</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      button#refine {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 1.5px solid rgba(255, 255, 255, 0.95);
        border-radius: 50%;
        background: radial-gradient(circle at 42% 36%, #e83a48 0%, #d41c2c 58%, #b01624 100%);
        color: #fff;
        font: 700 13px/1 "Segoe UI Symbol", "Avenir Next", sans-serif;
        cursor: pointer;
        box-shadow: 0 1px 4px rgba(176, 22, 36, 0.45);
        -webkit-app-region: no-drag;
      }
      button#refine:hover {
        transform: scale(1.06);
      }
      button#refine:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      button#refine.err {
        background: #7f1d1d;
      }
    </style>
  </head>
  <body>
    <button id="refine" type="button" title="Refine this Teams message with LiveTrack AI">✦</button>
    <script>
      const btn = document.getElementById("refine");
      function setBusy(busy, note) {
        btn.disabled = Boolean(busy);
        btn.classList.toggle("err", Boolean(note) && !busy);
        btn.textContent = busy ? "…" : note ? "!" : "✦";
        if (note) btn.title = note;
        else btn.title = "Refine this Teams message with LiveTrack AI";
      }
      window.teamsChat?.onBusy?.((data) => setBusy(data?.busy, data?.note));
      btn.addEventListener("click", async () => {
        if (btn.disabled) return;
        setBusy(true);
        try {
          const res = await window.teamsChat.refine();
          if (!res?.ok) setBusy(false, res?.error || "Refine failed");
          else setBusy(false);
        } catch (err) {
          setBusy(false, err?.message || "Refine failed");
        }
      });
    </script>
  </body>
</html>
