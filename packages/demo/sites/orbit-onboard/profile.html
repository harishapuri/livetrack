<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Onboard — Profile</title>
    <style>
      :root {
        --bg: #f3f6f9;
        --ink: #0f172a;
        --line: #cbd5e1;
        --accent: #0ea5e9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "Avenir Next", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, color-mix(in srgb, var(--accent) 16%, transparent), transparent 36%),
          var(--bg);
        min-height: 100vh;
      }
      main { max-width: 640px; margin: 0 auto; padding: 40px 22px 64px; }
      .site { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
      h1 { margin: 6px 0 8px; font-size: 1.75rem; }
      .sub { margin: 0 0 24px; color: #475569; }
      .steps { display: flex; gap: 8px; margin: 0 0 28px; }
      .steps span {
        flex: 1; text-align: center; font-size: 0.78rem; padding: 8px;
        border-radius: 999px; background: #e2e8f0; color: #64748b;
      }
      .steps span.on { background: var(--accent); color: #fff; }
      form { display: grid; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
      label { display: grid; gap: 6px; font-size: 0.92rem; }
      input {
        font: inherit; padding: 10px 12px; border: 1px solid var(--line);
        border-radius: 8px; background: #fff;
      }
      button {
        margin-top: 6px; justify-self: start; font: inherit; padding: 11px 16px;
        border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="site">Orbit Onboard</div>
      <h1>Profile</h1>
      <p class="sub">Page 2 of the click-stream — fill fields, then Continue.</p>
      <div class="steps">
        <span>1 Welcome</span>
        <span class="on">2 Profile</span>
        <span>3 Review</span>
      </div>
      <form id="profileForm" onsubmit="event.preventDefault(); location.href='/sites/orbit-onboard/review';">
        <label>
          Full name
          <input id="fullName" name="fullName" type="text" />
        </label>
        <label>
          Work email
          <input id="email" name="email" type="email" />
        </label>
        <label>
          Role
          <input id="role" name="role" type="text" />
        </label>
        <button id="btnContinue" type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
