<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanStream Apply — Welcome</title>
    <style>
      :root {
        --bg: #f7f4ef;
        --ink: #1c1917;
        --line: #d6d3d1;
        --accent: #c2410c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "Avenir Next", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, color-mix(in srgb, var(--accent) 14%, transparent), transparent 36%),
          var(--bg);
        min-height: 100vh;
      }
      main { max-width: 640px; margin: 0 auto; padding: 40px 22px 64px; }
      .site { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
      h1 { margin: 6px 0 8px; font-size: 1.75rem; }
      .sub { margin: 0 0 24px; color: #57534e; line-height: 1.45; }
      .card {
        background: transparent; border: 0; border-radius: 0;
        padding: 4px 0; display: grid; gap: 14px;
      }
      .plan-options { display: grid; gap: 10px; }
      .plan-options label {
        display: flex; gap: 10px; align-items: flex-start;
        padding: 12px; border: 1px solid var(--line); border-radius: 10px;
        cursor: pointer;
      }
      .plan-options label:has(input:checked) {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, #fff);
      }
      button {
        justify-self: start; font: inherit; padding: 11px 16px; border: 0;
        border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
      }
      .hint { margin-top: 18px; color: #78716c; font-size: 0.88rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="site">PlanStream Apply</div>
      <div id="app"></div>
      <p class="hint">URL: http://127.0.0.1:4173/sites/planstream-apply/</p>
    </main>
    <script>
      const app = document.getElementById("app");

      function showAccept() {
        app.innerHTML =
          "<h1>Terms</h1>" +
          '<p class="sub">Page 1 of 2 — three clicks on this URL, then a new page.</p>' +
          '<div class="card">' +
          "<p>Demo terms: accept to continue to plan selection on this same URL.</p>" +
          '<button id="btnAccept" type="button">Accept</button>' +
          "</div>";
        document.getElementById("btnAccept").onclick = showPlan;
      }

      function showPlan() {
        app.innerHTML =
          "<h1>Choose plan</h1>" +
          '<p class="sub">Click 2 — still this page. Pick a plan, then Choose plan.</p>' +
          '<div class="card">' +
          "<p>Select a plan for this demo application.</p>" +
          '<div class="plan-options">' +
          '<label><input type="radio" name="plan" value="starter" /><span><strong>Starter</strong> — core access for individuals</span></label>' +
          '<label><input type="radio" name="plan" value="team" checked /><span><strong>Team</strong> — shared seats for small groups</span></label>' +
          '<label><input type="radio" name="plan" value="scale" /><span><strong>Scale</strong> — org-wide rollout</span></label>' +
          "</div>" +
          '<button id="btnChoosePlan" type="button">Choose plan</button>' +
          "</div>";
        document.getElementById("btnChoosePlan").onclick = showContinue;
      }

      function showContinue() {
        app.innerHTML =
          "<h1>Ready for eligibility</h1>" +
          '<p class="sub">Click 3 — navigates to the eligibility page (new URL).</p>' +
          '<div class="card">' +
          "<p>Plan saved. Continue opens a new webpage for eligibility checks.</p>" +
          '<button id="btnContinueLanding" type="button">Continue</button>' +
          "</div>";
        document.getElementById("btnContinueLanding").onclick = function () {
          // Absolute path — relative "eligibility" breaks when the URL has no trailing slash
          location.href = "/sites/planstream-apply/eligibility";
        };
      }

      showAccept();
    </script>
  </body>
</html>
