<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Registration — Demo Form</title>
    <style>
      :root {
        --bg: #f3f1ec;
        --ink: #1c1917;
        --line: #d6d0c6;
        --accent: #0f766e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(15, 118, 110, 0.08), transparent 28%),
          var(--bg);
        min-height: 100vh;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }
      .sub {
        margin: 0 0 28px;
        color: #57534e;
      }
      form {
        display: grid;
        gap: 14px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 0.95rem;
      }
      input {
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 100px 120px;
        gap: 12px;
      }
      button {
        margin-top: 8px;
        justify-self: start;
        font: inherit;
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .hint {
        margin-top: 20px;
        padding: 12px 14px;
        border-left: 3px solid var(--accent);
        background: rgba(15, 118, 110, 0.08);
        color: #44403c;
        font-size: 0.92rem;
      }
      @media (max-width: 640px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vendor registration</h1>
      <p class="sub">Demo form for LiveTrack — leave this tab open, then click a queue card in the desktop app. More demos: <a href="/sites/" style="color: var(--accent);">/sites/</a></p>

      <form id="vendorForm" onsubmit="event.preventDefault(); alert('Submitted (demo only)');">
        <label>
          Company name
          <input id="companyName" name="companyName" type="text" required />
        </label>
        <label>
          Contact name
          <input id="contactName" name="contactName" type="text" required />
        </label>
        <label>
          Email
          <input id="email" name="email" type="email" required />
        </label>
        <label>
          Phone
          <input id="phone" name="phone" type="tel" />
        </label>
        <label>
          Tax ID
          <input id="taxId" name="taxId" type="text" />
        </label>
        <label>
          Address
          <input id="address" name="address" type="text" />
        </label>
        <div class="row">
          <label>
            City
            <input id="city" name="city" type="text" />
          </label>
          <label>
            State
            <input id="state" name="state" type="text" maxlength="2" />
          </label>
          <label>
            ZIP
            <input id="zip" name="zip" type="text" />
          </label>
        </div>
        <button id="submitBtn" type="submit">Submit registration</button>
      </form>

      <p class="hint">
        LiveTrack will fill fields one by one and highlight them. It stops before submit so you can review.
      </p>
    </main>
  </body>
</html>
