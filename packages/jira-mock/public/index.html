<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock Jira — liveAct test</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Mock Jira</h1>
        <p class="sub">Local board for testing liveAct Jira sync</p>
      </div>
      <button id="btnRefresh" class="btn ghost" type="button">Refresh</button>
    </header>

    <section class="creds card">
      <h2>liveAct Settings</h2>
      <p class="hint">Paste these into liveAct → ⚙ Settings → Jira fields, then Save and open the <strong>J</strong> button.</p>
      <dl id="creds" class="creds-grid"></dl>
      <button id="btnCopy" class="btn primary" type="button">Copy settings JSON</button>
    </section>

    <section class="layout">
      <div class="card">
        <div class="row-head">
          <h2>Stories</h2>
          <span class="muted" id="count">0</span>
        </div>
        <div id="list" class="list"></div>
      </div>

      <div class="card">
        <h2>Add / edit</h2>
        <form id="form" class="form">
          <label>
            Key
            <input id="fKey" name="key" placeholder="LIVEACT-200" required />
          </label>
          <label>
            Summary
            <input id="fSummary" name="summary" placeholder="Story title" required />
          </label>
          <label>
            Status
            <select id="fStatus" name="status">
              <option>To Do</option>
              <option>In Progress</option>
              <option>In Review</option>
              <option>Blocked</option>
              <option>Done</option>
            </select>
          </label>
          <label>
            Priority
            <select id="fPriority" name="priority">
              <option>Highest</option>
              <option>High</option>
              <option selected>Medium</option>
              <option>Low</option>
              <option>Lowest</option>
            </select>
          </label>
          <label>
            Idle days (sets updated)
            <input id="fIdle" name="idle" type="number" min="0" step="0.5" value="2" />
          </label>
          <div class="actions">
            <button class="btn primary" type="submit">Create story</button>
            <button id="btnUpdate" class="btn ghost" type="button" disabled>Update selected</button>
          </div>
        </form>

        <div class="comments-pane">
          <h3>Comments on selected</h3>
          <ul id="comments" class="comments"></ul>
        </div>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
