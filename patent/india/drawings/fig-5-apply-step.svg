<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700">
  <rect width="720" height="700" fill="#ffffff"/>
  <text x="24" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="700">FIG. 5</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="190" y="52" width="340" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="360" y="80" text-anchor="middle">60  Run-card 52 or apply-step 54</text>
