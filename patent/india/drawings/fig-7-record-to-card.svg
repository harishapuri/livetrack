    <rect x="300" y="60" width="200" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="400" y="90" text-anchor="middle">90 Recorder 40</text>
    <text x="400" y="110" text-anchor="middle">clicks and field values</text>
    <rect x="530" y="60" width="190" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="625" y="90" text-anchor="middle">92 Draft procedure 42</text>
    <text x="625" y="110" text-anchor="middle">status = draft</text>
    <line x1="260" y1="95" x2="300" y2="95" stroke="#000000" stroke-width="1.5"/>
    <polygon points="300,95 288,89 288,101" fill="#000000"/>
    <line x1="500" y1="95" x2="530" y2="95" stroke="#000000" stroke-width="1.5"/>
    <polygon points="530,95 518,89 518,101" fill="#000000"/>
    <rect x="250" y="190" width="260" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="380" y="226" text-anchor="middle">94 Person edits the draft</text>
    <line x1="625" y1="130" x2="460" y2="190" stroke="#000000" stroke-width="1.5"/>
    <polygon points="460,190 474,182 468,196" fill="#000000"/>
    <rect x="80" y="310" width="240" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="200" y="340" text-anchor="middle">96 Dismiss</text>
    <text x="200" y="360" text-anchor="middle">No queue card created</text>
    <rect x="420" y="310" width="260" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="550" y="340" text-anchor="middle">96 Approve</text>
    <text x="550" y="360" text-anchor="middle">status = published</text>
    <text x="550" y="380" text-anchor="middle">Approval gate 44</text>
    <line x1="300" y1="250" x2="200" y2="310" stroke="#000000" stroke-width="1.5"/>
    <polygon points="200,310 204,296 216,304" fill="#000000"/>
    <line x1="460" y1="250" x2="530" y2="310" stroke="#000000" stroke-width="1.5"/>
    <polygon points="530,310 514,304 520,316" fill="#000000"/>
    <rect x="420" y="430" width="260" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="550" y="460" text-anchor="middle">New queue card 16</text>
    <text x="550" y="480" text-anchor="middle">in queue store 14</text>
    <line x1="550" y1="400" x2="550" y2="430" stroke="#000000" stroke-width="1.5"/>
    <polygon points="550,430 544,418 556,418" fill="#000000"/>
