<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="24" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="700">FIG. 7</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="40" y="60" width="220" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="150" y="90" text-anchor="middle">Page matches no card 16</text>
