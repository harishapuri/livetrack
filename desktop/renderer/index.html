<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coact</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">C</span>
          <div>
            <h1>Coact</h1>
            <p class="tagline">Watch the agent fill forms from queue cards</p>
          </div>
        </div>
        <div class="status-pill" id="extStatus">
          <span class="dot"></span>
          <span id="extStatusText">Extension offline</span>
        </div>
      </header>

      <main class="layout">
        <section class="panel queue-panel">
          <div class="panel-head">
            <h2>Queue</h2>
            <span class="muted" id="queueCount">0 cards</span>
          </div>
          <div id="queueList" class="queue-list"></div>
        </section>

        <section class="panel run-panel">
          <div class="panel-head">
            <h2>Live steps</h2>
            <div class="controls">
              <button id="btnPause" class="btn ghost" disabled>Pause</button>
              <button id="btnResume" class="btn ghost" disabled>Resume</button>
              <button id="btnCancel" class="btn danger" disabled>Take over</button>
            </div>
          </div>
          <p class="active-card" id="activeCard">Select a queue card to start.</p>
          <ol id="stepList" class="step-list"></ol>
          <p class="run-note" id="runNote"></p>
        </section>
      </main>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
